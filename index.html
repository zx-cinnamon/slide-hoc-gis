<style>
  html,body{margin:0;height:100%;background:#0d0e12;color:#ECECEC;overflow:hidden;font-family:'Source Serif 4','Noto Serif',Georgia,serif}
  #wrap{position:fixed;inset:0;bottom:44px;display:flex;align-items:center;justify-content:center}
  #stage{width:100%;height:100%;display:block;cursor:pointer;user-select:none}
  #hud{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:15px;color:#8A8F98;background:#0a0b0e;border-top:1px solid #1d2028}

  #sec{color:#58C4DD}
  #dots{display:flex;gap:5px;margin-left:6px}
  #dots i{width:7px;height:7px;border-radius:50%;background:#2c313b;display:block}
  #dots i.on{background:#F7D96F}
  #sp{flex:1}
  #hud button{background:#161820;border:1px solid #2a2e38;color:#ECECEC;border-radius:8px;height:30px;min-width:34px;padding:0 10px;font:inherit;cursor:pointer}

  #barw{position:fixed;left:0;right:0;bottom:44px;height:2px;background:#15171d}
  #bar{height:100%;background:#58C4DD;width:0;transition:width .3s}
  .keys{font-size:13px;color:#5d636e}

  #menu{position:fixed;inset:0;bottom:44px;background:rgba(10,11,14,.94);display:none;overflow:auto;padding:40px 6vw}
  #menu.open{display:block}
  #menu h2{font-weight:400;margin:0 0 20px;font-size:28px}
  #menu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  #menu-list button{text-align:left;background:#14161c;border:1px solid #23262f;color:#ECECEC;padding:12px 14px;border-radius:10px;font:inherit;font-size:17px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
  #menu-list button:hover{border-color:#F7D96F}
  #menu-list span{color:#F7D96F;min-width:22px}
  #menu-list em{color:#58C4DD;font-style:normal;font-size:14px;min-width:44px}
</style>

    let x = (o.x || 0) - ({ l: 0, c: total / 2, r: total }[o.anchor || 'l']);

  box(e, o = {}) {
    const b = bboxIn(e, this.root); const p = o.pad ?? 12;

  }
  label(str, o = {}) { return this.text(str, { size: 24, color: C.dim, x: 64, y: 58, ...o }); }
  title(str, o = {}) { return this.text(str, { size: 46, x: 64, y: 124, ...o }); }
  arrow(x1, y1, x2, y2, o = {}) {
    const g = E('g', {}, o.parent || this.root);
    const col = o.color || C.fg, w = o.w || 4, hs = o.head || 16;
    const a = Math.atan2(y2 - y1, x2 - x1);
    const bx = x2 - Math.cos(a) * hs * 0.9, by = y2 - Math.sin(a) * hs * 0.9;
    E('line', { x1, y1, x2: bx, y2: by, stroke: col, 'stroke-width': w, 'stroke-linecap': 'round' }, g);
    const h = [[x2, y2], [x2 - Math.cos(a - 0.4) * hs, y2 - Math.sin(a - 0.4) * hs], [x2 - Math.cos(a + 0.4) * hs, y2 - Math.sin(a + 0.4) * hs]];

  curveArrow(x1, y1, x2, y2, bend, o = {}) {

    E('path', { d: ptsD([[x2, y2], [x2 - Math.cos(a - .4) * hs, y2 - Math.sin(a - .4) * hs], [x2 - Math.cos(a + .4) * hs, y2 - Math.sin(a + .4) * hs]], true), fill: col }, g);

  code(lines, o = {}) { // monospace block; markup {y|..} supported

  }
  card(x, y, w, h, o = {}) { return this.rect(x, y, w, h, { color: o.color || C.faint, fill: o.fill || '#161820', fo: o.fo ?? 1, w: o.w ?? 2, rx: 14, ...o }); }
}
function ptsD(pts, close) { return pts.length ? 'M' + pts.map(p => p[0].toFixed(2) + ' ' + p[1].toFixed(2)).join(' L') + (close ? ' Z' : '') : ''; }
function bboxIn(e, root) {
  const b = e.getBBox(); const m = e.getCTM(), r = root.getCTM().inverse().multiply(m);

  return { x: Math.min(...xs), y: Math.min(...ys), width: Math.max(...xs) - Math.min(...xs), height: Math.max(...ys) - Math.min(...ys) };
}

class Plane {
  constructor(s, o) {
    this.s = s; Object.assign(this, { x0: 0, x1: 10, y0: 0, y1: 6, left: 120, top: 160, unit: 70, step: 1, labels: true }, o);
    this.g = s.g(o.parent || s.root); op(this.g, 0);
    this.gridG = E('g', {}, this.g); this.axG = E('g', {}, this.g); this.lblG = E('g', {}, this.g);
    this.layer = E('g', {}, this.g); // content layer
    const X = v => this.X(v), Y = v => this.Y(v);
    for (let x = Math.ceil(this.x0); x <= this.x1; x += this.step) if (x !== 0 || this.y0 > 0) E('line', { x1: X(x), y1: Y(this.y0), x2: X(x), y2: Y(this.y1), stroke: C.grid, 'stroke-opacity': .32, 'stroke-width': 1.5 }, this.gridG);
    for (let y = Math.ceil(this.y0); y <= this.y1; y += this.step) if (y !== 0 || this.x0 > 0) E('line', { x1: X(this.x0), y1: Y(y), x2: X(this.x1), y2: Y(y), stroke: C.grid, 'stroke-opacity': .32, 'stroke-width': 1.5 }, this.gridG);
    const ax = Math.max(this.x0, Math.min(0, this.x1)), ay = Math.max(this.y0, Math.min(0, this.y1));
    E('line', { x1: X(this.x0), y1: Y(ay), x2: X(this.x1) + 18, y2: Y(ay), stroke: C.fg, 'stroke-width': 2.5 }, this.axG);
    E('line', { x1: X(ax), y1: Y(this.y0), x2: X(ax), y2: Y(this.y1) - 18, stroke: C.fg, 'stroke-width': 2.5 }, this.axG);
    E('path', { d: ptsD([[X(this.x1) + 30, Y(ay)], [X(this.x1) + 14, Y(ay) - 7], [X(this.x1) + 14, Y(ay) + 7]], true), fill: C.fg }, this.axG);
    E('path', { d: ptsD([[X(ax), Y(this.y1) - 30], [X(ax) - 7, Y(this.y1) - 14], [X(ax) + 7, Y(this.y1) - 14]], true), fill: C.fg }, this.axG);
    if (this.labels) {
      const ls = this.labelStep || this.step;
      for (let x = Math.ceil(this.x0); x <= this.x1; x += ls) if (x !== ax || true) { const t = E('text', { x: X(x), y: Y(ay) + 28, 'font-size': 20, fill: C.dim, 'text-anchor': 'middle', 'font-family': FONT }, this.lblG); t.textContent = x; }
      for (let y = Math.ceil(this.y0); y <= this.y1; y += ls) if (y !== ay) { const t = E('text', { x: X(ax) - 12, y: Y(y) + 7, 'font-size': 20, fill: C.dim, 'text-anchor': 'end', 'font-family': FONT }, this.lblG); t.textContent = y; }
      const xl = E('text', { x: X(this.x1) + 34, y: Y(ay) + 8, 'font-size': 26, fill: C.fg, 'font-style': 'italic', 'font-family': FONT }, this.lblG); xl.textContent = this.xName || 'x';
      const yl = E('text', { x: X(ax) + 12, y: Y(this.y1) - 26, 'font-size': 26, fill: C.fg, 'font-style': 'italic', 'font-family': FONT }, this.lblG); yl.textContent = this.yName || 'y';
    }
    this.bounds = [[this.x0, this.y0], [this.x1, this.y0], [this.x1, this.y1], [this.x0, this.y1]];
  }
  X(x) { return this.left + (x - this.x0) * this.unit; }
  Y(y) { return this.top + (this.y1 - y) * this.unit; }
  P(x, y) { return [this.X(x), this.Y(y)]; }
  S(pts) { return pts.map(p => this.P(p[0], p[1])); }
  async create(dur = 1400) {
    op(this.g, 1); [this.gridG, this.axG, this.lblG].forEach(g => op(g, 0));
    op(this.gridG, 1);
    const lines = [...this.gridG.children];
    lines.forEach(l => { l.style.strokeDasharray = 2000; l.style.strokeDashoffset = 2000; });
    const p = Promise.all(lines.map((l, i) => wait(i * (dur * 0.4) / lines.length).then(() => tween(dur * 0.6, k => l.style.strokeDashoffset = 2000 * (1 - k))).then(() => l.style.strokeDasharray = '')));
    await all(create(this.axG, dur * 0.7), fadeIn(this.lblG, dur));
    await p;
  }
  show() { op(this.g, 1); }
  poly(pts, o = {}) { return this.s.poly(this.S(pts), { parent: this.layer, ...o }); }
  seg(a, b, o = {}) { const [x1, y1] = this.P(...a), [x2, y2] = this.P(...b); return this.s.line(x1, y1, x2, y2, { parent: this.layer, ...o }); }
  polyline(pts, o = {}) { return this.s.path(ptsD(this.S(pts)), { parent: this.layer, ...o }); }
  dot(x, y, o = {}) { const [a, b] = this.P(x, y); return this.s.circle(a, b, o.r || 7, { parent: this.layer, fill: o.color || C.fg, ...o }); }
  half(a, b, c, o = {}) { return this.poly(clipHalf(this.bounds, a, b, c), { w: 0, fill: o.color || C.yellow, fo: o.fo ?? .18, ...o }); }

    const B = this.bounds; for (let i = 0; i < 4; i++) { const P = B[i], Q = B[(i + 1) % 4]; const fp = a * P[0] + b * P[1] + c, fq = a * Q[0] + b * Q[1] + c; if (fp === 0) pts.push(P); else if (fp * fq < 0) { const t = fp / (fp - fq); pts.push([P[0] + t * (Q[0] - P[0]), P[1] + t * (Q[1] - P[1])]); } }

}

/* simple 3D camera */
function cam3(o) {
  return (x, y, z) => {
    const c = Math.cos(o.yaw), s = Math.sin(o.yaw);
    const X = x * c - y * s, Y = x * s + y * c;
    return [o.cx + o.s * X, o.cy - o.s * (z * Math.cos(o.pitch) + Y * Math.sin(o.pitch))];
  };
}

/* ---------- Player: scenes, steps, navigation ---------- */
const SCENES = [];
function scene(id, sec, title, build) { SCENES.push({ id, sec, title, build }); }
const tx = s => s.raw[0];

let cur = 0, step = 0, steps = [], busy = false;
const svg = document.getElementById('stage');

async function load(i, k = 0) {
  GEN++; SKIP = false; busy = false;
  cur = Math.max(0, Math.min(SCENES.length - 1, i));
  const old = svg.querySelector('#root'); if (old) old.remove();
  const root = E('g', { id: 'root' }, svg);
  const s = new S(root);
  INSTANT = true;
  try {
    steps = (await SCENES[cur].build(s)) || [];
    if (k < 0) k = steps.length;
    for (let j = 0; j < k && j < steps.length; j++) await steps[j]();
  } finally { INSTANT = false; }
  step = Math.min(k, steps.length);
  try { history.replaceState(null, '', '#' + SCENES[cur].id); } catch (e) {}
  ui();
}
async function runStep() {
  if (step >= steps.length) return;
  const g = GEN; busy = true; ui();
  const fn = steps[step++];
  ui();
  await fn();
  if (g === GEN) { busy = false; SKIP = false; ui(); }
}
async function next() {
  if (busy) { SKIP = true; return; }
  if (step < steps.length) return runStep();
  if (cur < SCENES.length - 1) { await load(cur + 1, 0); return runStep(); }
}
async function prev() {
  if (step > 1) return load(cur, step - 1);
  if (cur > 0) return load(cur - 1, -1);
  return load(0, 0);
}
function ui() {
  const sc = SCENES[cur];
  document.getElementById('sec').textContent = sc.sec;
  document.getElementById('ttl').textContent = sc.title;
  document.getElementById('num').textContent = (cur + 1) + ' / ' + SCENES.length;
  const d = document.getElementById('dots'); d.innerHTML = '';
  for (let i = 0; i < steps.length; i++) { const s = document.createElement('i'); if (i < step) s.className = 'on'; d.appendChild(s); }
  document.getElementById('bar').style.width = ((cur + (steps.length ? step / steps.length : 1)) / SCENES.length * 100) + '%';
}
function buildMenu() {
  const m = document.getElementById('menu-list'); m.innerHTML = '';
  SCENES.forEach((sc, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<span>${i + 1}</span><em>${sc.sec}</em>${sc.title}`;
    b.onclick = () => { toggleMenu(false); load(i, 0).then(runStep); };
    m.appendChild(b);
  });
}
function toggleMenu(v) { const m = document.getElementById('menu'); m.classList.toggle('open', v ?? !m.classList.contains('open')); }
function fullscreen() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); } catch (e) {} }

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (['ArrowRight', ' ', 'PageDown', 'Enter', 'ArrowDown'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'r' || k === 'R') { load(cur, 0).then(runStep); }
  else if (k === 'f' || k === 'F') fullscreen();
  else if (k === 'm' || k === 'M' || k === 'Escape') toggleMenu(k === 'Escape' ? false : undefined);
  else if (k === 'Home') load(0, 0).then(runStep);
});
svg.addEventListener('click', e => { const r = svg.getBoundingClientRect(); (e.clientX - r.left < r.width * 0.25) ? prev() : next(); });
document.getElementById('bn').onclick = next;
document.getElementById('bp').onclick = prev;
document.getElementById('bm').onclick = () => toggleMenu();
document.getElementById('bf').onclick = fullscreen;
document.getElementById('br').onclick = () => load(cur, 0).then(runStep);

window.addEventListener('load', () => {
  buildMenu();
  const h = location.hash.slice(1); const i = SCENES.findIndex(s => s.id === h);
  load(i >= 0 ? i : 0, 0).then(() => { if (!window.__TEST) runStep(); });
});
/* test hooks */
window.__goto = (i, k) => load(i, k);
window.__info = () => SCENES.map((s, i) => [i, s.id]);

const inside = (p, cons) => cons.every(([a, b, c]) => a * p[0] + b * p[1] + c <= 1e-9);
function rng(seed) { let s = seed >>> 0; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; }

function captioner(s, o = {}) {
  let curEl = null;
  return async (str, oo = {}) => {

function lineEnds(Pl, a, b, c) {
  const pts = []; const B = Pl.bounds;
  for (let i = 0; i < 4; i++) { const P = B[i], Q = B[(i + 1) % 4]; const fp = a * P[0] + b * P[1] + c, fq = a * Q[0] + b * Q[1] + c; if (Math.abs(fp) < 1e-9) pts.push(P); else if (fp * fq < 0) { const t = fp / (fp - fq); pts.push([P[0] + t * (Q[0] - P[0]), P[1] + t * (Q[1] - P[1])]); } }

/* ================= 19. Projection (Fourier–Motzkin) ================= */
scene('chieu', '4.2.3', 'Projection π x (Spat): khử biến y', s => {
  const lab = s.label('4.2.3 — Ví dụ 3: Figure 4.10, 4.11, 4.12 (Fourier–Motzkin)');
  const ttl = s.title('Chiếu Spat lên trục x');
  const Pl = s.plane({ x0: 0, x1: 10, y0: 0, y1: 7, unit: 60, left: 80, top: 180 });
  const p1 = Pl.poly(P1, { color: C.blue, w: 2, fill: C.blue, fo: .3 });
  const p2 = Pl.poly(P2, { color: C.teal, w: 2, fill: C.teal, fo: .3 });
  const lo1 = [Pl.seg([1, 1], [17 / 3, 1], { color: C.blue, w: 7 }), Pl.seg([17 / 3, 1], [7, 3], { color: C.blue, w: 7 })];
  const up1 = [Pl.seg([1, 1], [4, 4], { color: C.gold, w: 7 }), Pl.seg([4, 4], [7, 3], { color: C.gold, w: 7 })];
  const lo2 = [Pl.seg([17 / 3, 1], [9, 1], { color: C.blue, w: 7 })];
  const up2 = [Pl.seg([17 / 3, 1], [9, 6], { color: C.gold, w: 7 })];
  const vline = Pl.seg([0, 0], [0, 7], { color: C.fg, w: 2, dash: '6 6' });
  const feas = Pl.seg([0, 0], [0, 0], { color: C.green, w: 8 });
  const sh1 = Pl.seg([1, 0], [1, 0], { color: C.blue, w: 9 }), sh2 = Pl.seg([17 / 3, 0], [17 / 3, 0], { color: C.teal, w: 9 });
  setT(sh1, { y: -14 }); setT(sh2, { y: -32 });
  const B1 = { lo: [x => 1, x => 1.5 * x - 7.5], up: [x => x, x => (16 - x) / 3], xmax: 1e9, a: 1, b: 7, sh: sh1 };
  const B2 = { lo: [x => 1], up: [x => 1.5 * x - 7.5], xmax: 9, a: 17 / 3, b: 9, sh: sh2 };
  const sweep = (B, X) => {
    const lo = Math.max(...B.lo.map(f => f(X))), up = Math.min(...B.up.map(f => f(X)));
    const [vx] = Pl.P(X, 0); vline.setAttribute('x1', vx); vline.setAttribute('x2', vx);
    const ok = lo <= up + 1e-9 && X <= B.xmax;
    const [fx, fy1] = Pl.P(X, lo), [, fy2] = Pl.P(X, up);
    feas.setAttribute('x1', fx); feas.setAttribute('x2', fx); feas.setAttribute('y1', fy1); feas.setAttribute('y2', ok ? fy2 : fy1); feas.setAttribute('opacity', ok ? 1 : 0);
    const e = Math.min(X, B.b);
    if (X >= B.a) { B.sh.setAttribute('x2', Pl.X(e)); }
  };
  const panel = s.g();
  const T = (raw, y, o = {}) => s.tex(raw, { x: 760, y, size: 28, parent: panel, ...o });
  const h1 = s.text('P₁ — Bước 1: tách y thành cận dưới / cận trên', { x: 760, y: 240, size: 26, color: C.yellow, parent: panel });
  const b1 = T(tx`\Bl{\text{cận dưới:}}\ \ y\ge 1,\qquad y\ge \tfrac{3x}{2}-\tfrac{15}{2}`, 305);
  const b2 = T(tx`\Go{\text{cận trên:}}\ \ y\le x,\qquad y\le -\tfrac{x}{3}+\tfrac{16}{3}`, 370);
  const h2 = s.text('Bước 2: có y  ⇔  {b|mọi cận dưới} ≤ {o|mọi cận trên}', { x: 760, y: 440, size: 26, parent: panel });
  const pr = [tx`1\le x\ \Rightarrow\ x\ge 1`, tx`\tfrac{3x}{2}-\tfrac{15}{2}\le x\ \Rightarrow\ x\le 15`, tx`1\le -\tfrac{x}{3}+\tfrac{16}{3}\ \Rightarrow\ x\le 13`, tx`\tfrac{3x}{2}-\tfrac{15}{2}\le -\tfrac{x}{3}+\tfrac{16}{3}\ \Rightarrow\ x\le 7`].map((r, i) => T(r, 510 + i * 62));
  const strikes = [1, 2].map(i => s.line(750, 510 + i * 62 - 10, 1240, 510 + i * 62 - 10, { color: C.red, w: 3, parent: panel }));
  const red = s.text('thừa (redundant)', { x: 1260, y: 568, size: 22, color: C.red, parent: panel });
  const r1 = s.tex(tx`\pi_x(P_1)=\Bl{[\,1,\ 7\,]}`, { x: 760, y: 800, size: 34 });
  const panel2 = s.g();
  const U = (raw, y) => s.tex(raw, { x: 760, y, size: 28, parent: panel2 });
  const g1 = s.text('P₂ — làm tương tự', { x: 760, y: 240, size: 26, color: C.teal, parent: panel2 });
  const g2 = U(tx`\Bl{\text{cận dưới:}}\ y\ge 1\qquad \Go{\text{cận trên:}}\ y\le \tfrac{3x}{2}-\tfrac{15}{2}`, 305);
  const g3 = U(tx`\text{không chứa }y:\ \ x\le 9`, 370);
  const g4 = U(tx`1\le \tfrac{3x}{2}-\tfrac{15}{2}\ \Rightarrow\ x\ge \tfrac{17}{3}`, 445);
  const r2 = s.tex(tx`\pi_x(P_2)=\Tl{[\,\tfrac{17}{3},\ 9\,]}`, { x: 1180, y: 800, size: 34 });
  const fin = s.tex(tx`\pi_x(\text{Spat})=(\Bl{1\le x\le 7})\vee(\Tl{\tfrac{17}{3}\le x\le 9})\ =\ [\,1,\ 9\,]`, { x: 760, y: 560, size: 32 });
  const ov = Pl.seg([17 / 3, 0], [7, 0], { color: C.yellow, w: 6 }); setT(ov, { y: -23 });
  const ovt = s.text('hai đoạn chồng nhau (17/3 ≈ 5.67 < 7) — hợp lý: đa giác trải từ x = 1 đến x = 9', { x: 760, y: 640, size: 22, color: C.dim });
  return [
    async () => { await fadeIn(lab, 400); await write(ttl, 800); await Pl.create(800); await all(create(p1, 800), create(p2, 800)); await anim(p2, { opacity: .25 }, 400); },
    async () => { await fadeIn(h1, 500); await all(lo1.map(e => create(e, 700))); await write(b1, 1100); await all(up1.map(e => create(e, 700))); await write(b2, 1100); },
    async () => {
      await fadeIn(h2, 500); sweep(B1, 0.3); op(vline, 1); op(sh1, 1); op(feas, 0);
      await fadeIn(vline, 300);
      await tween(4800, k => sweep(B1, lerp(0.3, 9.6, k)), linear);
      await fadeOut(vline, 300); feas.setAttribute('opacity', 0);
    },
    async () => { await lag(pr, r => write(r, 1100), 350); },
    async () => { await all(strikes.map(l => create(l, 500))); await fadeIn(red, 400); await write(r1, 900); await indicate(sh1, C.blue); },
    async () => {
      await fadeOut(panel, 500); await all(anim(p1, { opacity: .25 }, 400), anim(p2, { opacity: 1 }, 400), [...lo1, ...up1].map(e => fadeOut(e, 400)));
      await fadeIn(g1, 400); await all(create(lo2[0], 600), create(up2[0], 600)); await write(g2, 1000); await write(g3, 700);
      sweep(B2, 0.3); op(sh2, 1); op(vline, 1); await fadeIn(vline, 300);
      await tween(3600, k => sweep(B2, lerp(0.3, 9.6, k)), linear);
      await fadeOut(vline, 300); feas.setAttribute('opacity', 0);
      await write(g4, 1000); await write(r2, 900);
    },
    async () => { await fadeOut(panel2, 400); await all(anim(p1, { opacity: 1 }, 400), fadeOut(lo2[0]), fadeOut(up2[0])); await write(fin, 1600); await create(ov, 600); await fadeIn(ovt, 500); }
  ];
});
