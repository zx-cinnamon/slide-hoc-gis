<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chương 4 · The Constraint Data Model — trình chiếu hoạt họa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=JetBrains+Mono:wght@400;600&display=swap&subset=vietnamese" rel="stylesheet">
<style>
  html,body{margin:0;height:100%;background:#0d0e12;color:#ECECEC;overflow:hidden;font-family:'Source Serif 4','Noto Serif',Georgia,serif}
  #wrap{position:fixed;inset:0;bottom:44px;display:flex;align-items:center;justify-content:center}
  #stage{width:100%;height:100%;display:block;cursor:pointer;user-select:none}
  #hud{position:fixed;left:0;right:0;bottom:0;height:44px;display:flex;align-items:center;gap:14px;padding:0 16px;font-size:15px;color:#8A8F98;background:#0a0b0e;border-top:1px solid #1d2028}
  #hud b{color:#ECECEC;font-weight:600}
  #sec{color:#58C4DD}
  #dots{display:flex;gap:5px;margin-left:6px}
  #dots i{width:7px;height:7px;border-radius:50%;background:#2c313b;display:block}
  #dots i.on{background:#F7D96F}
  #sp{flex:1}
  #st{font-size:14px;padding:3px 10px;border-radius:20px;white-space:nowrap}
  #st.run{color:#F7D96F;background:#2a2615;animation:pl 1s infinite}
  #st.ok{color:#83C167;background:#18241a}
  #st.end{color:#58C4DD;background:#14222a}
  #dots i.cur{background:#F7D96F;animation:pl .8s infinite}
  @keyframes pl{50%{opacity:.35}}
  #cue{position:fixed;right:26px;bottom:62px;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:24px;color:#83C167;border:2px solid #83C167;opacity:0;transition:opacity .3s;pointer-events:none}
  #cue.on{opacity:.9;animation:nudge 1.2s ease-in-out infinite}
  #cue.end{color:#58C4DD;border-color:#58C4DD}
  @keyframes nudge{50%{transform:translateX(6px)}}
  #hud button{background:#161820;border:1px solid #2a2e38;color:#ECECEC;border-radius:8px;height:30px;min-width:34px;padding:0 10px;font:inherit;cursor:pointer}
  #hud button:hover{border-color:#58C4DD}
  #barw{position:fixed;left:0;right:0;bottom:44px;height:2px;background:#15171d}
  #bar{height:100%;background:#58C4DD;width:0;transition:width .3s}
  .keys{font-size:13px;color:#5d636e}
  @media (max-width:700px){.keys,#ttl{display:none}}
  #menu{position:fixed;inset:0;bottom:44px;background:rgba(10,11,14,.94);display:none;overflow:auto;padding:40px 6vw}
  #menu.open{display:block}
  #menu h2{font-weight:400;margin:0 0 20px;font-size:28px}
  #menu-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  #menu-list button{text-align:left;background:#14161c;border:1px solid #23262f;color:#ECECEC;padding:12px 14px;border-radius:10px;font:inherit;font-size:17px;cursor:pointer;display:flex;gap:10px;align-items:baseline}
  #menu-list button:hover{border-color:#F7D96F}
  #menu-list span{color:#F7D96F;min-width:22px}
  #menu-list em{color:#58C4DD;font-style:normal;font-size:14px;min-width:44px}
</style>
</head>
<body>
<div id="wrap"><svg id="stage" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg"></svg></div>
<div id="barw"><div id="bar"></div></div>
<div id="hud">
  <button id="bm" title="Mục lục (M)">☰</button>
  <span id="sec"></span><b id="ttl"></b>
  <span id="dots"></span>
  <span id="st"></span>
  <span id="sp"></span>
  <span class="keys">→ / Space: tiếp · ←: lùi · R: chạy lại · F: toàn màn hình</span>
  <span id="num"></span>
  <button id="br" title="Chạy lại cảnh (R)">↺</button>
  <button id="bp" title="Lùi (←)">‹</button>
  <button id="bn" title="Tiếp (→)">›</button>
  <button id="bf" title="Toàn màn hình (F)">⛶</button>
</div>
<div id="cue"></div>
<div id="menu"><h2>Mục lục các cảnh</h2><div id="menu-list"></div></div>

/* simple 3D camera */
function cam3(o) {
  return (x, y, z) => {
    const c = Math.cos(o.yaw), s = Math.sin(o.yaw);
    const X = x * c - y * s, Y = x * s + y * c;
    return [o.cx + o.s * X, o.cy - o.s * (z * Math.cos(o.pitch) + Y * Math.sin(o.pitch))];

/* ---------- Player: scenes, steps, navigation ---------- */
const SCENES = [];
function scene(id, sec, title, build) { SCENES.push({ id, sec, title, build }); }
const tx = s => s.raw[0];

let cur = 0, step = 0, steps = [], busy = false;
const svg = document.getElementById('stage');

async function load(i, k = 0) {
  GEN++; SKIP = false; busy = false;
  cur = Math.max(0, Math.min(SCENES.length - 1, i));
  const old = svg.querySelector('#root'); if (old) old.remove();
  const root = E('g', { id: 'root' }, svg);
  const s = new S(root);
  INSTANT = true;
  try {
    steps = (await SCENES[cur].build(s)) || [];
    if (k < 0) k = steps.length;
    for (let j = 0; j < k && j < steps.length; j++) await steps[j]();
  } finally { INSTANT = false; }
  step = Math.min(k, steps.length);
  try { history.replaceState(null, '', '#' + SCENES[cur].id); } catch (e) {}
  ui();
}
async function runStep() {
  if (step >= steps.length) return;
  const g = GEN; busy = true; ui();
  const fn = steps[step++];
  ui();
  await fn();
  if (g === GEN) { busy = false; SKIP = false; ui(); }
}
async function next() {
  if (busy) { SKIP = true; return; }
  if (step < steps.length) return runStep();
  if (cur < SCENES.length - 1) { await load(cur + 1, 0); return runStep(); }
}
async function prev() {
  if (step > 1) return load(cur, step - 1);
  if (cur > 0) return load(cur - 1, -1);
  return load(0, 0);
}
function ui() {
  const sc = SCENES[cur];
  document.getElementById('sec').textContent = sc.sec;
  document.getElementById('ttl').textContent = sc.title;
  document.getElementById('num').textContent = (cur + 1) + ' / ' + SCENES.length;
  const d = document.getElementById('dots'); d.innerHTML = '';
  for (let i = 0; i < steps.length; i++) { const s = document.createElement('i'); if (i < step) s.className = 'on'; d.appendChild(s); }
  const stt = document.getElementById('st'), cue = document.getElementById('cue');
  if (busy) { stt.className = 'run'; stt.textContent = '● đang chạy…'; cue.className = ''; }
  else if (step < steps.length) { stt.className = 'ok'; stt.textContent = '✓ xong · bấm → tiếp'; cue.className = 'on'; cue.textContent = '→'; }
  else { stt.className = 'end'; stt.textContent = cur < SCENES.length - 1 ? '✓ hết cảnh · → sang cảnh sau' : '✓ hết bài'; cue.className = 'on end'; cue.textContent = cur < SCENES.length - 1 ? '⏭' : '■'; }
  const dd = d.children; if (busy && step > 0 && dd[step - 1]) dd[step - 1].className = 'cur';
  document.getElementById('bar').style.width = ((cur + (steps.length ? step / steps.length : 1)) / SCENES.length * 100) + '%';
}
function buildMenu() {
  const m = document.getElementById('menu-list'); m.innerHTML = '';
  SCENES.forEach((sc, i) => {
    const b = document.createElement('button');
    b.innerHTML = `<span>${i + 1}</span><em>${sc.sec}</em>${sc.title}`;
    b.onclick = () => { toggleMenu(false); load(i, 0).then(runStep); };
    m.appendChild(b);
  });
}
function toggleMenu(v) { const m = document.getElementById('menu'); m.classList.toggle('open', v ?? !m.classList.contains('open')); }
function fullscreen() { try { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); } catch (e) {} }

document.addEventListener('keydown', e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (['ArrowRight', ' ', 'PageDown', 'Enter', 'ArrowDown'].includes(k)) { e.preventDefault(); next(); }
  else if (['ArrowLeft', 'PageUp', 'Backspace', 'ArrowUp'].includes(k)) { e.preventDefault(); prev(); }
  else if (k === 'r' || k === 'R') { load(cur, 0).then(runStep); }
  else if (k === 'f' || k === 'F') fullscreen();
  else if (k === 'm' || k === 'M' || k === 'Escape') toggleMenu(k === 'Escape' ? false : undefined);
  else if (k === 'Home') load(0, 0).then(runStep);
});
svg.addEventListener('click', e => { const r = svg.getBoundingClientRect(); (e.clientX - r.left < r.width * 0.25) ? prev() : next(); });
document.getElementById('bn').onclick = next;
document.getElementById('bp').onclick = prev;

document.getElementById('bf').onclick = fullscreen;

window.addEventListener('load', () => {

});

    if (st.tile > 0) Pg(T.map((p, i) => [p[0], p[1], st.tile * H[i] * ZS]), { f: C.teal, fo: .5, c: C.teal, w: 2.5 });

/* ================= Cảnh bổ sung (giải thích dễ hiểu) ================= */
function miniTable(s, x, y, title, cols, rows, o = {}) {
  const g = s.g(); op(g, 0); const cw = o.cw || 110;
  s.text(title, { x, y, size: o.ts || 26, color: o.tc || C.yellow, parent: g, show: true });
  cols.forEach((c, i) => s.text(c, { x: x + i * cw, y: y + 40, size: 20, color: C.dim, parent: g, show: true, mono: true }));
  E('line', { x1: x - 8, y1: y + 54, x2: x + cw * cols.length - 10, y2: y + 54, stroke: C.faint, 'stroke-width': 1.5 }, g);
  rows.forEach((r, j) => r.forEach((v, i) => s.text(v, { x: x + i * cw, y: y + 88 + j * 36, size: 22, parent: g, show: true, mono: true, color: o.rc || C.fg })));
  g._rowY = j => y + 88 + j * 36;
  return g;
}
function setTxt(el, str, color) { const sp = el.querySelector('tspan'); sp.textContent = str; if (color) sp.setAttribute('fill', color); }
function clipSeg(A, B, cons) {
  let lo = 0, hi = 1;
  for (const [a, b, c] of cons) {
    const fa = a * A[0] + b * A[1] + c, fb = a * B[0] + b * B[1] + c;
    if (Math.abs(fb - fa) < 1e-12) { if (fa > 1e-9) return null; continue; }
    const t = fa / (fa - fb);
    if (fa > 0) lo = Math.max(lo, t); else if (fb > 0) hi = Math.min(hi, t);
  }
  return hi - lo > 1e-9 ? [lo, hi] : null;
}
const at = (A, B, t) => [A[0] + (B[0] - A[0]) * t, A[1] + (B[1] - A[1]) * t];
const polyCons = p => p.map((a, i) => { const b = p[(i + 1) % p.length]; const A = b[1] - a[1], B = a[0] - b[0]; return [A, B, -(A * a[0] + B * a[1])]; });

  const a2 = s.arrow(610, 340, 610, 425, { color: C.fg, w: 3 }), a2t = s.text('chiếu lên x', { x: 625, y: 390, size: 20, color: C.dim });
  const loop = s.curveArrow(460, 470, 180, 345, -80, { color: C.green, w: 3 });
  const lt = s.text('kết quả dùng tiếp\ncho truy vấn sau', { x: 190, y: 470, anchor: 'c', size: 20, color: C.green });

    .map(([t, f], i) => { const y = 270 + i * 120; const g = s.g(); op(g, 0); s.rect(850, y - 34, 660, 100, { color: C.faint, w: 2, fill: '#161820', fo: 1, parent: g, show: true }); s.text(t, { x: 870, y, size: 22, color: C.yellow, parent: g, show: true }); s.tex(f, { x: 870, y: y + 46, size: 24, parent: g, show: true }); return g; });

    async () => { await fadeIn(an1, 600, 10); await fadeIn(an1b, 600); },
    async () => { await fadeIn(hR, 500); await lag(stg, g => fadeIn(g, 500, 8), 250); op(tok, 1); await tween(3000, k => tok.setAttribute('cy', 270 + 360 * k), linear); await fadeIn(an2, 600, 10); }

/* ---------- ×, ⋈, ∩, σ: cùng một phép “∧” ---------- */
scene('bon-phep', '4.2.3', '×, ⋈, ∩, σ: thực chất là một phép', s => {
  const lab = s.label('4.2.3 — bốn phép đầu của đại số');
  const ttl = s.title('Bốn phép, một ý: {y|kéo dãn ra đủ biến, rồi lấy giao (∧)}');
  const Pl = s.plane({ x0: 0, x1: 9, y0: 0, y1: 6, unit: 66, left: 90, top: 190 });
  const panel = s.g();
  const T = (raw, y, o = {}) => s.tex(raw, { x: 790, y, size: 28, parent: panel, ...o });
  const X = (str, y, o = {}) => s.text(str, { x: 790, y, size: 24, parent: panel, ...o });
  const objs = [];
  const keep = (...e) => { objs.push(...e); return e[0]; };
  const clearAll = () => all(objs.splice(0).map(e => fadeOut(e, 350)));
  // × : interval × interval = rectangle
  const r1 = keep(Pl.seg([1, 0], [3, 0], { color: C.blue, w: 9 })), r2 = keep(Pl.seg([0, 2], [0, 4], { color: C.gold, w: 9 }));
  const b1 = keep(Pl.poly([[1, 0], [3, 0], [3, 0], [1, 0]], { color: C.blue, w: 0, fill: C.blue, fo: .22 })), b2 = keep(Pl.poly([[0, 2], [0, 2], [0, 4], [0, 4]], { color: C.gold, w: 0, fill: C.gold, fo: .22 }));
  const rect = keep(Pl.poly([[1, 2], [3, 2], [3, 4], [1, 4]], { color: C.green, w: 3, fill: C.green, fo: .6 }));
  const hx = keep(X('① Tích ×: {y|không chung biến}', 250, { color: C.fg, size: 28 }));
  const fx1 = keep(T(tx`\Bl{R_1(x):\ 1\le x\le 3}\qquad \Go{R_2(y):\ 2\le y\le 4}`, 320));
  const fx2 = keep(X('R₁ không nói gì về y → {b|dải dọc};  R₂ không nói gì về x → {o|dải ngang}', 375, { size: 22, color: C.dim }));
  const fx3 = keep(T(tx`R_1\times R_2:\ \Bl{1\le x\le 3}\wedge\Go{2\le y\le 4}`, 440));
  const fx4 = keep(X('= giao hai dải = {g|hình chữ nhật}', 490, { size: 24 }));
  const growB = (poly, pts) => k => poly.setAttribute('d', ptsD(Pl.S(pts(k)), true));
  // ⋈ : polygon R(x,y) with band S(y)
  const RS = [[1, 1], [7, 1], [7, 3], [4, 4]];
  const jR = Pl.poly(RS, { color: C.blue, w: 3, fill: C.blue, fo: .25 });
  const jS = Pl.poly([[0, 2], [9, 2], [9, 3.5], [0, 3.5]], { color: C.gold, w: 2, dash: '8 6', fill: C.gold, fo: .18 });
  const jS0 = Pl.seg([0, 2], [0, 3.5], { color: C.gold, w: 9 });
  const jRes = Pl.poly(clipAll(RS, [[0, -1, 2], [0, 1, -3.5]]), { color: C.green, w: 3, fill: C.green, fo: .6 });
  const hj = X('② Join ⋈: {y|chung một phần biến} (ở đây: y)', 250, { size: 28 });
  const fj1 = T(tx`\Bl{R(x,y)}:\ y\le x\wedge x\le 7\wedge y\ge 1\wedge x+3y\le 16`, 320);
  const fj2 = T(tx`\Go{S(y)}:\ 2\le y\le 3.5`, 375);
  const fj3 = X('S chỉ có y → kéo dãn theo x thành {o|dải ngang}; ghép theo y', 425, { size: 22, color: C.dim });
  const fj4 = T(tx`R\bowtie S:\ \Bl{R}\wedge\Go{2\le y\le 3.5}`, 490);
  // ∩
  const iS = Pl.poly([[3, 2], [8, 2], [8, 4.5], [3, 4.5]], { color: C.gold, w: 2.5, dash: '8 6', fill: C.gold, fo: .15 });
  const iRes = Pl.poly(clipAll(RS, [[-1, 0, 3], [1, 0, -8], [0, -1, 2], [0, 1, -4.5]]), { color: C.green, w: 3, fill: C.green, fo: .6 });
  const hi = X('③ Giao ∩: {y|chung tất cả biến} (x và y)', 250, { size: 28 });
  const fi1 = T(tx`\Go{S(x,y)}:\ 3\le x\le 8\wedge 2\le y\le 4.5`, 320);
  const fi2 = X('không cần kéo dãn — đã cùng không gian', 375, { size: 22, color: C.dim });
  const fi3 = T(tx`R\cap S:\ \Bl{R}\wedge\Go{S}`, 440);
  // σ
  const sH = Pl.half(1, 1, -6.5, { color: C.purple, fo: .18 });
  const sL = Pl.seg([0.5, 6], [6.5, 0], { color: C.purple, w: 2.5, dash: '8 6' });
  const sRes = Pl.poly(clipHalf(RS, 1, 1, -6.5), { color: C.green, w: 3, fill: C.green, fo: .6 });
  const hs = X('④ Chọn σ: ⋈ với {p|một ràng buộc}', 250, { size: 28 });
  const fs1 = T(tx`F:\ \Pu{x+y\le 6.5}\ \ \text{(cũng là một quan hệ: nửa mặt phẳng)}`, 320, { size: 26 });
  const fs2 = T(tx`\sigma_F(R)=R\bowtie F:\ \Bl{R}\wedge\Pu{x+y\le 6.5}`, 390);
  // summary
  const sum = s.g(); op(sum, 0);
  const center = s.tex(tx`t_1\wedge t_2`, { x: 800, y: 560, anchor: 'c', size: 60, color: C.yellow, parent: sum, show: true });
  s.text('chỉ nối ràng buộc — không tính hình học', { x: 800, y: 615, anchor: 'c', size: 24, color: C.dim, parent: sum, show: true });
  const nodes = [['×', 'không chung biến', 260, 300], ['⋈', 'chung một phần', 620, 260], ['∩', 'chung tất cả', 980, 260], ['σ', '⋈ với một ràng buộc', 1340, 300]];
  nodes.forEach(([o, d, x, y]) => { s.text(o, { x, y, anchor: 'c', size: 64, color: C.blue, parent: sum, show: true }); s.text(d, { x, y: y + 44, anchor: 'c', size: 22, parent: sum, show: true }); s.arrow(x + (800 - x) * .15, y + 70, x + (800 - x) * .7, 500, { color: C.faint, w: 3, parent: sum, show: true }); });
  s.text('× là ⋈ khi không có biến chung   ·   ∩ là ⋈ khi mọi biến đều chung   ·   số tuple kết quả = |e₁| · |e₂|', { x: 800, y: 720, anchor: 'c', size: 24, parent: sum, show: true });
  [jR, jS, jS0, jRes, hj, fj1, fj2, fj3, fj4, iS, iRes, hi, fi1, fi2, fi3, sH, sL, sRes, hs, fs1, fs2].forEach(e => op(e, 0));
  return [
    async () => { await fadeIn(lab, 400); await write(ttl, 1100); await Pl.create(800); await fadeIn(hx, 500); await all(create(r1, 600), create(r2, 600)); await write(fx1, 1100); },
    async () => {
      await fadeIn(fx2, 500); op(b1, 1); op(b2, 1);
      await all(tween(1300, growB(b1, k => [[1, 0], [3, 0], [3, 6 * k], [1, 6 * k]])), tween(1300, growB(b2, k => [[0, 2], [9 * k, 2], [9 * k, 4], [0, 4]])));
      await create(rect, 700); await write(fx3, 1000); await fadeIn(fx4, 500);
    },
    async () => {
      await clearAll(); await fadeIn(hj, 500); await create(jR, 800); await write(fj1, 1100); await create(jS0, 400); await write(fj2, 700);
      await fadeIn(fj3, 400); op(jS, 1); await tween(1200, growB(jS, k => [[0, 2], [9 * k, 2], [9 * k, 3.5], [0, 3.5]])); await create(jRes, 700); await write(fj4, 900);
    },
    async () => { await all([jS, jS0, jRes, hj, fj1, fj2, fj3, fj4].map(e => fadeOut(e, 350))); await fadeIn(hi, 500); await create(iS, 700); await write(fi1, 900); await fadeIn(fi2, 400); await create(iRes, 700); await write(fi3, 800); },
    async () => { await all([iS, iRes, hi, fi1, fi2, fi3].map(e => fadeOut(e, 350))); await fadeIn(hs, 500); await create(sL, 700); await fadeIn(sH, 500); await write(fs1, 1000); await create(sRes, 700); await write(fs2, 1000); },
    async () => { await all([Pl.g, jR, sH, sL, sRes, hs, fs1, fs2].map(e => fadeOut(e, 400))); await fadeIn(sum, 800); await indicate(center, C.yellow); }
  ];
});
